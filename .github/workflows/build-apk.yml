name: Build and publish SBE Quotations APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version to build for test artifact, e.g. 1.0.0. Official OTA releases use a v* tag.'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          TOOLS_DIR="$SDK_ROOT/cmdline-tools/16.0"
          if [[ ! -x "$TOOLS_DIR/bin/sdkmanager" ]]; then
            TMP_DIR="$(mktemp -d)"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" -o "$TMP_DIR/cmdline-tools.zip"
            unzip -q "$TMP_DIR/cmdline-tools.zip" -d "$TMP_DIR"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            rm -rf "$TOOLS_DIR"
            mv "$TMP_DIR/cmdline-tools" "$TOOLS_DIR"
            rm -rf "$TMP_DIR"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$TOOLS_DIR/bin/sdkmanager" --licenses >/dev/null

      - name: Install Android 36 build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Determine version and repository
        id: meta
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0"; fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then version="$REQUESTED_VERSION"; fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2; exit 1
          fi
          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "repo_owner=${GITHUB_REPOSITORY_OWNER}" >> "$GITHUB_OUTPUT"
          echo "repo_name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Build test APK (branch or manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_OWNER: ${{ steps.meta.outputs.repo_owner }}
          GITHUB_REPO: ${{ steps.meta.outputs.repo_name }}
        run: |
          gradle --no-daemon clean assembleDebug \
            -PappVersionCode=${{ steps.meta.outputs.version_code }} \
            -PappVersionName='${{ steps.meta.outputs.version_name }}'
          cp app/build/outputs/apk/debug/app-debug.apk SBE-Quotations-debug.apk

      - name: Prepare release signing key (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.SBE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || (echo "Missing SBE_KEYSTORE_BASE64 repository secret" >&2; exit 1)
          mkdir -p app/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/signing/sbe-release.keystore
          test -s app/signing/sbe-release.keystore

      - name: Build signed release APK (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_OWNER: ${{ steps.meta.outputs.repo_owner }}
          GITHUB_REPO: ${{ steps.meta.outputs.repo_name }}
          SBE_KEYSTORE_PASSWORD: ${{ secrets.SBE_KEYSTORE_PASSWORD }}
          SBE_KEY_ALIAS: ${{ secrets.SBE_KEY_ALIAS }}
          SBE_KEY_PASSWORD: ${{ secrets.SBE_KEY_PASSWORD }}
        run: |
          test -n "$SBE_KEYSTORE_PASSWORD"
          test -n "$SBE_KEY_ALIAS"
          test -n "$SBE_KEY_PASSWORD"
          gradle --no-daemon clean assembleRelease \
            -PappVersionCode=${{ steps.meta.outputs.version_code }} \
            -PappVersionName='${{ steps.meta.outputs.version_name }}'
          cp app/build/outputs/apk/release/app-release.apk SBE-Quotations.apk
          rm -f app/signing/sbe-release.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SBE-Quotations-APK
          path: ${{ startsWith(github.ref, 'refs/tags/v') && 'SBE-Quotations.apk' || 'SBE-Quotations-debug.apk' }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SBE Quotations v${{ steps.meta.outputs.version_name }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: SBE-Quotations.apk
